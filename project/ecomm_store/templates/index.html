{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    {% include "cdn.html" %}
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .content {
            flex: 1 0 auto;
        }
        
        .header-section {
            padding: 3rem 0;
            background-color: #fff;
        }

        .title-container {
            position: relative;
            padding: 2rem;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #000;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .fancy-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .divider-line {
            height: 2px;
            width: 150px;
            background: #000;
        }

        /* Remove blue underline from product links */
        .product-link {
            text-decoration: none;
            display: block;
        }

        .product-card {
            transition: transform 0.2s;
            height: 100%;
            border: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }

        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .btn-add-cart {
            transition: all 0.2s;
            padding: 0.5rem 1rem;
            border-radius: 5px;
        }

        .btn-add-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- header -->
    {% include "header.html" %}

    <!-- Messages/Alerts -->
    {% if messages %}
    <div id="alert-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1080; width: 320px">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show slide-in" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% empty %}
        <div class="alert alert-info alert-dismissible fade show slide-in" role="alert">
            No notifications at this time.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Main Content -->
    <div class="content">
        <!-- slider -->
        {% include "slider.html" %}

        <!-- product slider -->
        {% include "product_slider.html" %}
        
        <!-- Other content sections -->
    </div>

    <!-- Footer -->
    {% include "footer.html" %}

    <!-- Scripts -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".toast").forEach(function (toastEl) {
                new bootstrap.Toast(toastEl).show();
            });
        });
    </script>
</body>
</html>
